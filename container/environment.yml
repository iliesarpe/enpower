# Python environment of every experiment (Python 3.10, as in the paper).
# PyTorch (CPU) and CLIP are installed with pip by enpower.def.
name: base
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy
  - scipy
  - scikit-learn   # ensembles, fetch_openml
  - pandas
  - openml         # backend of fetch_openml
  - matplotlib
  - seaborn
  - numba          # required by the Troupe library (python/shapley)
  - tqdm
  - ftfy           # CLIP
  - regex          # CLIP
  - packaging      # CLIP
  - pip
